spring.application.name=lootsafe-v2
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.default-property-inclusion=non_null

spring.jpa.show-sql=true
spring.flyway.enabled=true

api.swagger.enabled=true
api.cors.allowed-origins=${API_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

jwt.secret=dev-jwt-secret-key-with-at-least-32-bytes!!
jwt.expirationMs=900000
jwt.refreshExpirationMs=604800000

spring.datasource.url=${DEV_DB_URL:jdbc:postgresql://localhost:5435/escrow_dev}
spring.datasource.username=${DEV_DB_USERNAME:escrow}
spring.datasource.password=${DEV_DB_PASSWORD:escrow}
spring.datasource.driver-class-name=org.postgresql.Driver

encryption.password=dev-password
encryption.salt=deadbeefdeadbeef

mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:TEST-token-temporario-dev}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:secret-temporario-dev}

payment.pix-validity-hours=${PAYMENT_PIX_VALIDITY_HOURS:24}
payment.expiration-check-interval-ms=${PAYMENT_EXPIRATION_CHECK_INTERVAL_MS:3600000}

platform.percentage=${PLATFORM_FEE_PERCENTAGE:5.0}
platform.fee-fixed=${PLATFORM_FEE_FIXED:1.00}

inspection.default-hours=${INSPECTION_DEFAULT_HOURS:2}
inspection.min-hours=${INSPECTION_MIN_HOURS:1}
inspection.max-hours=${INSPECTION_MAX_HOURS:72}
inspection.auto-release-interval-ms=${INSPECTION_AUTO_RELEASE_INTERVAL_MS:60000}

payout.retry-interval-ms=${PAYOUT_RETRY_INTERVAL_MS:300000}