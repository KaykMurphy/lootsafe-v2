spring.application.name=lootsafe-v2

management.endpoints.web.exposure.include=health,info
server.forward-headers-strategy=framework

bucket4j.enabled=true
bucket4j.cache-to-use=buckets

bucket4j.default-http-content-type=application/json
bucket4j.default-http-status-code=TOO_MANY_REQUESTS
bucket4j.default-http-response-body={ "message": "Too many requests!" }

bucket4j.default-metric-tags[0].key=IP
bucket4j.default-metric-tags[0].expression=getRemoteAddr()
bucket4j.default-metric-tags[0].types=REJECTED_COUNTER

bucket4j.filters[0].url=/api/users/login|/api/users/register
bucket4j.filters[0].key-filter=getRemoteAddr()
bucket4j.filters[0].rate-limits[0].bandwidths[0].capacity=10
bucket4j.filters[0].rate-limits[0].bandwidths[0].time=1
bucket4j.filters[0].rate-limits[0].bandwidths[0].unit=minutes
bucket4j.filters[0].rate-limits[0].bandwidths[0].refill-speed=greedy

mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:TEST-token-temporario}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:secret-temporario}

payment.pix-validity-hours=${PAYMENT_PIX_VALIDITY_HOURS:24}
payment.expiration-check-interval-ms=${PAYMENT_EXPIRATION_CHECK_INTERVAL_MS:3600000}

# Configurações de Taxa da Plataforma
platform.percentage=${PLATFORM_FEE_PERCENTAGE:5.0}
platform.fee-fixed=${PLATFORM_FEE_FIXED:1.00}

# Configurações de Janela de Inspeção
inspection.default-hours=${INSPECTION_DEFAULT_HOURS:2}
inspection.min-hours=${INSPECTION_MIN_HOURS:1}
inspection.max-hours=${INSPECTION_MAX_HOURS:72}
inspection.auto-release-interval-ms=${INSPECTION_AUTO_RELEASE_INTERVAL_MS:60000}

# Configurações de Payout
payout.retry-interval-ms=${PAYOUT_RETRY_INTERVAL_MS:300000}
